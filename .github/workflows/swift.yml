name: iOS Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Native xtool Compiler
        run: |
          set -euxo pipefail
          curl -fL "https://github.com/xtool-org/xtool/releases/latest/download/xtool.app.zip" -o xtool.app.zip
          unzip -q xtool.app.zip
          chmod +x xtool.app/Contents/MacOS/xtool
          sudo cp xtool.app/Contents/MacOS/xtool /usr/local/bin/xtool
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Verify xtool Toolchain
        run: xtool --version

      - name: Compile iOS IPA Build Binary
        run: |
          xtool dev build --ipa

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TimeSecondsDisplayer-Build
          path: build/*.ipa
